<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>24時間限定 特別クーポン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* ==============================================
       Premium Design Settings 
       ============================================== */
    :root {
      --primary-color: #E63946;  /* たこ焼きを連想させる赤 */
      --gold-color: #FFB703;     /* プレミアム感を出すゴールド */
      --bg-color: #1A1A2E;       /* リッチなダーク背景 */
      --text-main: #FFFFFF;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      width: 100%;
      text-align: center;
      padding: 20px 0;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-color), #D62828);
      box-shadow: 0 4px 20px rgba(230, 57, 70, 0.4);
      letter-spacing: 2px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 40px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 読み込み中のスタイル */
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--gold-color);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* クーポンチケットのスタイル */
    .ticket-wrapper {
      width: 100%;
      display: none; /* ロード完了まで非表示 */
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ticket {
      background: #FFFFFF;
      color: #333333;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 3px solid var(--gold-color);
      overflow: hidden;
    }

    /* チケットの切り欠きデザイン */
    .ticket::before, .ticket::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40px;
      height: 40px;
      background-color: var(--bg-color);
      border-radius: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }
    .ticket::before { left: -22px; border-right: 3px solid var(--gold-color); }
    .ticket::after { right: -22px; border-left: 3px solid var(--gold-color); }

    .coupon-title {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary-color);
      margin: 0 0 10px 0;
    }

    .coupon-desc {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 20px 0;
      color: #555;
    }

    /* カウントダウン表示部 */
    .timer-container {
      background: #111111;
      color: var(--gold-color);
      padding: 20px;
      border-radius: 12px;
      font-family: 'Inter', monospace;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 2px;
      margin: 20px 0;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      position: relative;
    }
    
    .timer-label {
      font-size: 12px;
      color: #fff;
      display: block;
      margin-bottom: 5px;
      letter-spacing: normal;
    }

    .warning-text {
      color: #E63946;
      font-size: 12px;
      font-weight: bold;
    }

    /* 期限切れオーバーレイ */
    .expired-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
      border-radius: 13px; /* チケット枠内用 */
      backdrop-filter: blur(4px);
    }

    .expired-overlay h2 {
      color: var(--primary-color);
      font-size: 32px;
      margin: 0 0 10px 0;
    }
    .expired-overlay p {
      font-size: 14px;
      color: #bbb;
    }

  </style>
</head>
<body>

  <header>🎁 特別ご優待</header>

  <div class="container">
    
    <div id="loader">
      <div class="spinner"></div>
      <div>サーバーと通信中...</div>
    </div>

    <div id="ticketWrapper" class="ticket-wrapper">
      <div class="ticket">
        
        <!-- 期限切れ時のカバー -->
        <div id="expiredOverlay" class="expired-overlay">
          <h2>期限切れ</h2>
          <p>このクーポンは有効期間が終了しました</p>
        </div>

        <h1 class="coupon-title">トッピング<br>1品 無料！</h1>
        <p class="coupon-desc">ねぎ・チーズ・明太マヨから選べます</p>
        
        <div class="timer-container">
          <span class="timer-label">残り有効時間</span>
          <div id="timer">--:--:--</div>
        </div>

        <p class="warning-text">※ご注文時にこの画面のタイマーが動いていることをスタッフにご提示ください。<br>※スクリーンショットは無効です。</p>
      </div>
    </div>
    
  </div>

  <script>
    // -------------------------------------------------------------
    // LIFF ID (アンケートで使っていたものと同じIDを流用)
    // -------------------------------------------------------------
    const liffId = "2009757711-dbg9tKQU"; 
    
    // -------------------------------------------------------------
    // 【サーバーと通信】クーポンの発券時刻を取得する関数
    // -------------------------------------------------------------
    async function fetchCouponData(userId) {
      // 実際はGASなどのサーバーAPIへGETリクエストを送ります
      // URL例: const API_URL = "https://script.google.com/macros/s/xxxx/exec";
      
      /* 本番実装の例：
      try {
        const response = await fetch(`${API_URL}?action=checkCoupon&userId=${userId}`);
        const data = await response.json(); 
        // 期待するレスポンス: { activatedAt: "2026-04-09T10:00:00Z" }
        return data;
      } catch(e) {
        console.error(e);
        return null;
      }
      */

      // ▼今回は開発・デモ用にサーバーレスで動くようローカルストレージを使ってシミュレートします▼
      return new Promise((resolve) => {
        setTimeout(() => {
          let activatedAt = localStorage.getItem("temp_coupon_activated_" + userId);
          
          if (!activatedAt) {
             // 初回アクセス：サーバー側で現在時刻を記録したと仮定
             activatedAt = new Date().toISOString();
             localStorage.setItem("temp_coupon_activated_" + userId, activatedAt);
          }
          resolve({ activatedAt: activatedAt });
        }, 800); // 擬似的な通信の遅延(UX向上のため)
      });
    }

    // -------------------------------------------------------------
    // タイマーのカウントダウン処理
    // -------------------------------------------------------------
    let countdownInterval;

    function startTimer(activatedAtStr) {
      const activatedMs = new Date(activatedAtStr).getTime();
      // 有効期間：24時間 = 24 * 60 * 60 * 1000 = 86400000 ミリ秒
      // （※テスト時はここを 1 * 60 * 1000 = 1分 などにすると動作確認しやすいです）
      const validityPeriodMs = 24 * 60 * 60 * 1000;
      const expiresMs = activatedMs + validityPeriodMs;

      countdownInterval = setInterval(() => {
        const now = new Date().getTime();
        const remain = expiresMs - now;

        if (remain <= 0) {
          clearInterval(countdownInterval);
          document.getElementById("timer").innerText = "00:00:00";
          document.getElementById("expiredOverlay").style.display = "flex";
          return;
        }

        // 残り時間の計算
        const hours = Math.floor(remain / (1000 * 60 * 60));
        const mins  = Math.floor((remain % (1000 * 60 * 60)) / (1000 * 60));
        const secs  = Math.floor((remain % (1000 * 60)) / 1000);

        document.getElementById("timer").innerText = 
          String(hours).padStart(2, '0') + ":" + 
          String(mins).padStart(2, '0') + ":" + 
          String(secs).padStart(2, '0');
      }, 1000);
      
      // UIの切り替え
      document.getElementById("loader").style.display = "none";
      document.getElementById("ticketWrapper").style.display = "block";
    }

    // -------------------------------------------------------------
    // LIFFの初期化
    // -------------------------------------------------------------
    async function initLiff() {
      try {
        await liff.init({ liffId: liffId });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        
        const profile = await liff.getProfile();
        
        // サーバーにユーザーIDを渡し、クーポンの有効期限開始時刻をもらう
        const data = await fetchCouponData(profile.userId);

        if (data && data.activatedAt) {
          startTimer(data.activatedAt);
        } else {
          document.getElementById("loader").innerHTML = "データの取得に失敗しました<br>もう一度やり直してください。";
        }
        
      } catch(err) {
        document.getElementById("loader").innerHTML = "LIFF初期化エラー:<br>" + err.message;
      }
    }

    // 起動
    initLiff();
  </script>
</body>
</html>
